spring.application.name=productapi
spring.datasource.url=jdbc:postgresql://localhost:5432/productdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- E-posta (Gmail SMTP) ----
# Kimlik bilgilerini koda gömme; ortam degiskeninden oku:
#   MAIL_USERNAME=senin@gmail.com  MAIL_PASSWORD=<16 haneli Gmail App Password>
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
# Gonderen adresi (bos birakilirsa spring.mail.username kullanilir)
app.mail.from=${MAIL_USERNAME:no-reply@stackboot.local}

# ---- JWT ----
# Uretimde JWT_SECRET'i mutlaka ortam degiskeninden ver (en az 32 karakter).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min!!}
app.jwt.expiration-ms=86400000